<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Single main gradient - warm coral/rose as primary -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="60%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </radialGradient>
    
    <!-- Crown color - lighter tone of same palette -->
    <linearGradient id="crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#B71C1C" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background circle - single main color -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  
  <!-- ===== Simplified Crown ===== -->
  <g filter="url(#shadow)">
    <!-- Simple continuous crown outline -->
    <path d="M150 270 
             L150 240 L175 205 L200 240 L200 260
             L216 260 L216 220 L256 170 L296 220 L296 260
             L312 260 L312 240 L337 205 L362 240 L362 270Z"
          fill="url(#crown)" stroke="#FFE0B2" stroke-width="2"/>
    
    <!-- Three jewel dots on crown tips -->
    <circle cx="175" cy="202" r="8" fill="#FF5252"/>
    <circle cx="256" cy="166" r="9" fill="#FF5252"/>
    <circle cx="337" cy="202" r="8" fill="#FF5252"/>
  </g>
  
  <!-- Single small heart icon at center -->
  <path d="M256 278 
           C 256 278, 240 264, 232 254
           C 224 244, 226 232, 234 226
           C 242 220, 256 226, 256 236
           C 256 226, 270 220, 278 226
           C 286 232, 288 244, 280 254
           C 272 264, 256 278, 256 278Z"
        fill="#FFFFFF" opacity="0.9"/>
</svg>